name: Build Android APK

on:
  push:
    branches: [main, 'rebuild/**']
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name mithaq_al_mumin --org com.mithaqalmumin .
          fi

      - name: Enable Android core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          if not p.exists():
              p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          if p.suffix == '.kts':
              if 'isCoreLibraryDesugaringEnabled = true' not in s:
                  s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              if 'coreLibraryDesugaringEnabled true' not in s:
                  s = s.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
              dep = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
          if dep not in s:
              if 'dependencies {' not in s:
                  s += '\ndependencies {\n    ' + dep + '\n}\n'
              else:
                  s = s.replace('dependencies {', 'dependencies {\n    ' + dep, 1)
          p.write_text(s)
          PY

      - name: Configure Android notification and location permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s, label_count = re.subn(r'(<application\b[^>]*\bandroid:label=")[^"]+(")', r'\1ميثاق المؤمن\2', s, count=1)
          permissions = [
              '  <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
              '  <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>',
              '  <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>',
              '  <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>',
          ]
          marker = '  <application'
          if marker not in s:
              raise SystemExit('Android manifest application tag not found')
          missing = [x for x in permissions if x.split('"')[1] not in s]
          if missing:
              s = s.replace(marker, '\n'.join(missing) + '\n' + marker, 1)

          PY

      - name: Download verified Uthmani Quran data
        run: |
          mkdir -p assets/quran
          curl --fail --location --retry 3 --silent --show-error \
            https://raw.githubusercontent.com/dotquran/corpus/main/processed/uthmani/quran-uthmani.json \
            --output assets/quran/quran-uthmani.json
          test -s assets/quran/quran-uthmani.json
          grep -q '"source"[[:space:]]*:[[:space:]]*"Tanzil Project"' assets/quran/quran-uthmani.json
          cat > assets/quran/ATTRIBUTION.txt <<'EOF'
          Quran Arabic text: Tanzil Quran Text, Uthmani Version 1.1.
          Copyright (C) Tanzil Project.
          License: Creative Commons Attribution 3.0.
          Source: https://tanzil.net/
          The Quran text must not be modified. See https://tanzil.net/docs/Text_License
          JSON packaging source: https://github.com/dotquran/corpus
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        run: flutter test

      - name: Generate launcher icon from official logo
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 512 -h 512 assets/logo.svg -o assets/logo.png
          dart run flutter_launcher_icons
          dart run flutter_native_splash:create

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mithaq-al-mumin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
