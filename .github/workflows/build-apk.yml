name: Build Android APK

on:
  push:
    branches: [main, 'rebuild/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files if missing
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name mithaq_al_mumin --org com.mithaqalmumin .
          fi

      - name: Enable Android core library desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          if not p.exists():
              p = Path('android/app/build.gradle.kts')
          s = p.read_text()
          if p.suffix == '.kts':
              if 'isCoreLibraryDesugaringEnabled = true' not in s:
                  s = s.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true', 1)
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              if 'coreLibraryDesugaringEnabled true' not in s:
                  s = s.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true', 1)
              dep = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
          if dep not in s:
              if 'dependencies {' not in s:
                  s += '\ndependencies {\n    ' + dep + '\n}\n'
              else:
                  s = s.replace('dependencies {', 'dependencies {\n    ' + dep, 1)
          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze lib test --no-fatal-infos --no-fatal-warnings

      - name: Run widget tests
        run: flutter test

      - name: Generate launcher icon from official logo
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          rsvg-convert -w 512 -h 512 assets/logo.svg -o assets/logo.png
          dart run flutter_launcher_icons

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mithaq-al-mumin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
