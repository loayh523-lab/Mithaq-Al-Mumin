name: mithaq_al_mumin
description: تطبيق ميثاق المؤمن الإسلامي
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.1
  adhan_dart: ^2.0.1
  shared_preferences: ^2.5.3
  flutter_compass: ^0.8.1
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1
  geolocator: ^13.0.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/quran/
    - assets/logo.svg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/logo.png
  adaptive_icon_background: '#000000'
  adaptive_icon_foreground: assets/logo.png
